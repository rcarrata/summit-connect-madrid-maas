# Compatibility HTTPRoute for Opus 5 ExternalModel.
#
# The MaaS ext-proc rewrites the request path to /anthropic/v1/messages
# (the Bedrock Mantle endpoint) and clears the Envoy route cache.
# The auto-generated HTTPRoute only matches on /external-models/opus5-cloud,
# so the re-route matching fails with route_not_found.
#
# This HTTPRoute catches the rewritten path and forwards to the same backend,
# adding the required anthropic-version header.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opus5-cloud-compat
  namespace: external-models
  labels:
    inference.opendatahub.io/compat-route: "true"
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: maas-default-gateway
    namespace: openshift-ingress
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: anthropic-mantle
      port: 443
      weight: 1
    filters:
    - requestHeaderModifier:
        set:
        - name: Host
          value: bedrock-mantle.us-east-1.api.aws
        - name: anthropic-version
          value: "2023-06-01"
      type: RequestHeaderModifier
    matches:
    - path:
        type: PathPrefix
        value: /anthropic/v1/messages
    timeouts:
      request: 300s
